[project]
name = "tender-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "asyncpg==0.32.0",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "pytest==9.1.1",
  "docling==2.142.1",
  "pgqueuer==1.6.0",
  "pypdf==6.10.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "openai==3.37.0",
  "jsonschema==4.26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
